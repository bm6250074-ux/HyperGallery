name: Build HyperGallery APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract HyperGallery Project
        run: |
          if [ ! -f "HyperGallery.zip" ]; then
            echo "HyperGallery.zip not found!"
            exit 1
          fi

          unzip -o HyperGallery.zip -d .
          echo "Project extracted successfully."
          find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find Gradle Project
        run: |
          SETTINGS_FILE=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "*/.gradle/*" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "App Gradle file not found!"
            exit 1
          fi

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle -p "$PROJECT_DIR" :app:assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperGallery-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperGallery-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HyperGallery build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          
